<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub — Пополнение Steam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #141a24;
            border-radius: 32px;
            padding: 32px 24px;
            border: 1px solid #2a3344;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 44px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f5d34b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .header p {
            color: #8896ab;
            font-size: 14px;
            margin-top: 4px;
        }

        .product-card {
            background: #1e2735;
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid #2e3a4e;
            margin-bottom: 16px;
        }

        .product-card .badge {
            background: #f0b90b;
            color: #0b0e14;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-block;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .product-card h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-card .price {
            font-size: 30px;
            font-weight: 700;
            color: #f5d34b;
            margin: 6px 0 2px;
        }

        .product-card .price span {
            font-size: 14px;
            font-weight: 400;
            color: #8896ab;
        }

        .product-card .sales {
            font-size: 13px;
            color: #6a7a92;
            margin-bottom: 12px;
        }

        .product-card .sales strong {
            color: #e8edf5;
        }

        .product-card .desc {
            font-size: 14px;
            color: #b0c0d4;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* Стили для кнопки Digiseller */
        .digiseller-buy-standalone {
            width: 100% !important;
            background: linear-gradient(135deg, #f0b90b, #e0a80a) !important;
            color: #0b0e14 !important;
            font-weight: 700 !important;
            font-size: 18px !important;
            padding: 15px 0 !important;
            border-radius: 60px !important;
            text-align: center !important;
            border: none !important;
            cursor: pointer !important;
            font-family: 'Inter', Arial, sans-serif !important;
            transition: 0.2s !important;
            display: block !important;
            box-shadow: none !important;
        }

        .digiseller-buy-standalone:hover {
            transform: scale(1.02) !important;
            background: linear-gradient(135deg, #f5c42a, #e8b20e) !important;
        }

        /* Скрываем лишние элементы виджета */
        .digiseller-buy-standalone .digiseller-price {
            display: none !important;
        }
        .digiseller-buy-standalone .digiseller-name {
            display: none !important;
        }
        .digiseller-buy-standalone .digiseller-img {
            display: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #4a5a72;
            border-top: 1px solid #1e2735;
            padding-top: 18px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 16px;
            }
            .product-card h2 {
                font-size: 18px;
            }
            .product-card .price {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">🎮</div>
            <h1>TechHub</h1>
            <p>Пополнение Steam за 1 минуту</p>
        </div>

        <div class="product-card">
            <div class="badge">⚡ ТОП</div>
            <h2>Автопополнение баланса Steam</h2>
            <div class="price">
                0.25 $ <span>≈ 20 RUB</span>
            </div>
            <div class="sales">
                ⭐ Продано: <strong>1 334 596+</strong> товаров
            </div>
            <div class="desc">
                Мгновенное пополнение баланса Steam. Поддерживаются RUB, UAH, KZT.
            </div>

            <!-- КНОПКА ПОКУПКИ Digiseller (без ссылки на Plati.Market) -->
            <script>
                !function(e) {
                    var l = function(l) {
                        return e.cookie.match(new RegExp("(?:^|; )digiseller-" + l + "=([^;]*)"));
                    };
                    var i = l("lang");
                    var s = l("cart_uid");
                    var t = i ? "&lang=" + i[1] : "";
                    var d = s ? "&cart_uid=" + s[1] : "";
                    var r = e.getElementsByTagName("head")[0] || e.documentElement;
                    var n = e.createElement("link");
                    var a = e.createElement("script");
                    n.type = "text/css";
                    n.rel = "stylesheet";
                    n.id = "digiseller-css";
                    n.href = "//shop.digiseller.com/xml/store2_css.asp?seller_id=1379890";
                    a.async = !0;
                    a.id = "digiseller-js";
                    a.src = "//digiseller.com/store2/digiseller-api.js.asp?seller_id=1379890" + t + d;
                    if (!e.getElementById(n.id) && r.appendChild(n));
                    if (!e.getElementById(a.id) && r.appendChild(a));
                }(document);
            </script>

            <div style="display: block; width: 100%;" class="digiseller-buy-standalone" 
                 data-id="3300218" 
                 data-ai="1379890" 
                 data-img="0" 
                 data-name="0" 
                 data-price="0" 
                 data-no-price="1">
            </div>

        </div>

        <div class="footer">
            © 2026 TechHub · Сделано с ❤️
        </div>

    </div>

</body>
</html>
