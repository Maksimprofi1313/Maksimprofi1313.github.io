<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub — Товары</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1e1e2a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b0e14;
            margin-top: 4px;
        }

        .header p {
            color: #6b6b7b;
            font-size: 15px;
            margin-top: 2px;
        }

        .product-link {
            display: block;
            background: #f5f6f8;
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid #e8eaed;
            transition: 0.2s ease;
            text-decoration: none;
            color: inherit;
            margin-bottom: 10px;
        }

        .product-link:hover {
            border-color: #f5b700;
            background: #fafafb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
        }

        .product-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-icon {
            font-size: 32px;
            width: 54px;
            height: 54px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #e8eaed;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-info .name {
            font-size: 15px;
            font-weight: 600;
            color: #0b0e14;
            line-height: 1.3;
        }

        .product-info .price {
            font-size: 18px;
            font-weight: 700;
            color: #1e1e2a;
            margin-top: 2px;
        }

        .product-info .price small {
            font-size: 13px;
            font-weight: 400;
            color: #6b6b7b;
        }

        .product-info .sales {
            font-size: 13px;
            color: #6b6b7b;
            margin-top: 1px;
        }

        .product-info .sales strong {
            color: #0b0e14;
            font-weight: 600;
        }

        .arrow {
            font-size: 20px;
            color: #b0b0c0;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #b0b0c0;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .product-icon {
                width: 46px;
                height: 46px;
                font-size: 26px;
            }
            .product-info .name {
                font-size: 14px;
            }
            .product-info .price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">🛒</div>
            <h1>TechHub</h1>
            <p>Пополнение Steam за 1 минуту</p>
        </div>

        <!-- Товар 1 -->
        <a href="popolnenie-steam/" class="product-link">
            <div class="product-row">
                <div class="product-icon">💳</div>
                <div class="product-info">
                    <div class="name">🚀 Автоматическое пополнение баланса Steam</div>
                    <div class="price">21.60 ₽ <small>≈ 20 STEAM RUB</small></div>
                    <div class="sales">⭐ Продано: <strong>1 334 598+</strong></div>
                </div>
                <div class="arrow">›</div>
            </div>
        </a>

        <div class="footer">
            © 2026 TechHub
        </div>

    </div>

</body>
</html>
