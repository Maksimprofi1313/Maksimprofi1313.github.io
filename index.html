<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub — Товары</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: #141a24;
            border-radius: 32px;
            padding: 32px 24px;
            border: 1px solid #2a3344;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 44px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f5d34b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .header p {
            color: #8896ab;
            font-size: 14px;
            margin-top: 4px;
        }

        .product-card {
            background: #1e2735;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #2e3a4e;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .product-card:hover {
            border-color: #f0b90b;
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(240, 185, 11, 0.1);
        }

        .product-card .image {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: #2a3344;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .product-card .info {
            flex: 1;
            min-width: 0;
        }

        .product-card .info .name {
            font-size: 14px;
            font-weight: 600;
            color: #e8edf5;
            line-height: 1.3;
        }

        .product-card .info .price {
            font-size: 18px;
            font-weight: 700;
            color: #f5d34b;
            margin-top: 2px;
        }

        .product-card .info .price small {
            font-size: 12px;
            font-weight: 400;
            color: #8896ab;
        }

        .product-card .info .sales {
            font-size: 12px;
            color: #6a7a92;
        }

        .product-card .info .sales strong {
            color: #e8edf5;
        }

        .product-card .arrow {
            color: #4a5a72;
            font-size: 18px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #4a5a72;
            border-top: 1px solid #1e2735;
            padding-top: 18px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 16px;
            }
            .product-card .image {
                width: 52px;
                height: 52px;
                font-size: 26px;
            }
            .product-card .info .name {
                font-size: 13px;
            }
            .product-card .info .price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">🛒</div>
            <h1>TechHub</h1>
            <p>Все товары Killer1801</p>
        </div>

        <!-- ТОВАР 1 — ссылка на папку -->
        <a href="popolnenie-steam/" class="product-card">
            <div class="image">💳</div>
            <div class="info">
                <div class="name">🚀АВТОМАТИЧЕСКОЕ ПОПОЛНЕНИЕ БАЛАНСА STEAM 🚀RUB UAH KZT</div>
                <div class="price">21.60 ₽ <small>≈ 20 STEAM RUB</small></div>
                <div class="sales">⭐ Продано: <strong>1 334 598+</strong></div>
            </div>
            <div class="arrow">›</div>
        </a>

        <div class="footer">
            © 2026 TechHub · Все товары Killer1801
        </div>

    </div>

</body>
</html>
