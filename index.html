<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub — Магазин</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            background: #141a24;
            border-radius: 32px;
            padding: 32px 24px;
            border: 1px solid #2a3344;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f5d34b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .header p {
            color: #8896ab;
            font-size: 15px;
            margin-top: 2px;
        }

        /* Виджет магазина Digiseller */
        .digiseller-body {
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 auto !important;
            background: #1e2735 !important;
            border-radius: 16px !important;
            padding: 20px !important;
            border: 1px solid #2e3a4e !important;
            color: #e8edf5 !important;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #4a5a72;
            border-top: 1px solid #1e2735;
            padding-top: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .digiseller-body {
                padding: 12px !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">🛒</div>
            <h1>TechHub</h1>
            <p>Пополнение Steam за 1 минуту и не только!</p>
        </div>

        <!-- ВИДЖЕТ МАГАЗИНА Digiseller -->
        <script>
            !function(e) {
                var l = function(l) {
                    return e.cookie.match(new RegExp("(?:^|; )digiseller-" + l + "=([^;]*)"));
                };
                var i = l("lang");
                var s = l("cart_uid");
                var t = i ? "&lang=" + i[1] : "";
                var d = s ? "&cart_uid=" + s[1] : "";
                var r = e.getElementsByTagName("head")[0] || e.documentElement;
                var n = e.createElement("link");
                var a = e.createElement("script");
                n.type = "text/css";
                n.rel = "stylesheet";
                n.id = "digiseller-css";
                n.href = "//shop.digiseller.com/xml/store2_css.asp?seller_id=1379890";
                a.async = !0;
                a.id = "digiseller-js";
                a.src = "//digiseller.com/store2/digiseller-api.js.asp?seller_id=1379890" + t + d;
                if (!e.getElementById(n.id) && r.appendChild(n));
                if (!e.getElementById(a.id) && r.appendChild(a));
            }(document);
        </script>

        <span class="digiseller-body" id="digiseller-body" 
              data-partner-id="" 
              data-cat="h" 
              data-logo="1" 
              data-downmenu="1" 
              data-purchases="1" 
              data-langs="1" 
              data-cart="1" 
              data-search="1">
        </span>

        <div class="footer">
            © 2026 TechHub
        </div>

    </div>

</body>
</html>
